                sessionSummary: "",

            {
                id: "evt-6",
                date: "Octobre 1313",
                title: "Découverte du procédé « Nice Try »",
                category: "justice",
                isSecret: true,
                desc: "Révélé par les autorités lors des procès des arrestations de la purge. Fin officielle des opérations de ratissage intensif suite aux révélations judiciaires.",
                sessionSummary: "",

            },
            {

                date: "Avril 1314",
                title: "Lancement de la mission habitée vers Proxima",
                category: "spatial",
                isSecret: false,
                desc: "Célébration du centenaire du protocole Seldon. Premier convoi interstellaire habité expédié vers Proxima avec 20 Transférés à son bord.",
                sessionSummary: "",
                highlights: []
            }
        ];

        // État de l'application
        let timelineEvents = [];
        let showSecrets = true;
        let currentFilter = 'all';
        let searchQuery = '';
        let activeDebriefEventId = null;

        // Fonction d'analyse intelligente des dates libres pour assurer le tri
        function parseCyberDate(dateStr) {
            if (!dateStr) return 0;
            const s = dateStr.toLowerCase();
            
            // Cherche une année (4 chiffres)
            const yearMatch = s.match(/\d{4}/);
            const year = yearMatch ? parseInt(yearMatch[0], 10) : 0;
            
            // Cherche un mois textuel
            const months = ['janvier', 'février', 'fevrier', 'mars', 'avril', 'mai', 'juin', 'juillet', 'août', 'aout', 'septembre', 'octobre', 'novembre', 'décembre', 'decembre'];
            const monthMap = {
                'janvier': 1, 'février': 2, 'fevrier': 2, 'mars': 3, 'avril': 4, 'mai': 5, 'juin': 6,
                'juillet': 7, 'août': 8, 'aout': 8, 'septembre': 9, 'octobre': 10, 'novembre': 11, 'décembre': 12, 'decembre': 12
            };
            
            let month = 0;
            for (let m of months) {
                if (s.includes(m)) {
                    month = monthMap[m];
                    break;
                }
            }
            
            // Cherche un jour (avant le mois en général). Ex : "19 janvier" ou "1er mars"
            let day = 1; // 1 par défaut pour les périodes comme "Avril - Juillet"
            const dayMatch = s.match(/(\d{1,2})(er)?\s+(janvier|février|fevrier|mars|avril|mai|juin|juillet|août|aout|septembre|octobre|novembre|décembre|decembre)/);
            if (dayMatch) {
                day = parseInt(dayMatch[1], 10);
            }
            
            // Retourne un score de tri YYYYMMDD
            return (year * 10000) + (month * 100) + day;
        }

        // Applique le tri chronologique sur le tableau des événements
        function sortTimeline() {
            timelineEvents.sort((a, b) => parseCyberDate(a.date) - parseCyberDate(b.date));
        }

        async function initData() {
            try {
                const response = await fetch(`${GITHUB_JSON_URL}?t=${Date.now()}`, { cache: 'no-store' });
                if (!response.ok) {
                    throw new Error(`Chargement de latest.json impossible (HTTP ${response.status})`);
                }

                const data = await response.json();
                if (!Array.isArray(data)) {
                    throw new Error('Le fichier latest.json ne contient pas une liste d’événements');
                }

                timelineEvents = data;
                showToast("Dernière sauvegarde chargée depuis GitHub Pages", "success");
            } catch (error) {
                console.warn("Impossible de charger la dernière sauvegarde depuis GitHub Pages:", error);
                loadFromLocalStorage();
            }

            sortTimeline();
            renderTimeline();
        }

        function loadFromLocalStorage() {
            const stored = localStorage.getItem('yeast_eaters_timeline_v2');
            if (stored) {
                try {
                    timelineEvents = JSON.parse(stored);
                    showToast("Données chargées localement", "info");
                } catch(e) {
                    timelineEvents = [...DEFAULT_TIMELINE];
                }
            } else {
                timelineEvents = [...DEFAULT_TIMELINE];
                saveToLocalStorage();
            }
        }

        function saveToLocalStorage() {
            localStorage.setItem('yeast_eaters_timeline_v2', JSON.stringify(timelineEvents));
        }

        function showToast(message, type = 'info') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            const colors = {
                info: 'border-cyan-500/50 bg-slate-900 text-cyan-300',
                success: 'border-green-500/50 bg-slate-900 text-green-300',
                danger: 'border-red-500/50 bg-slate-900 text-red-300'
            };
            toast.className = `p-3 rounded-lg border shadow-lg text-xs font-mono flex items-center gap-2 transform transition-all duration-300 ${colors[type] || colors.info}`;
            toast.innerHTML = `<i class="fa-solid fa-circle-info"></i> <span>${message}</span>`;
            container.appendChild(toast);
            setTimeout(() => {
                toast.classList.add('opacity-0', 'translate-x-4');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        const CATEGORY_STYLES = {
            scenario: {
                label: "Scénario Joué",
                badgeClass: "bg-cyan-950/80 text-cyan-400 border-cyan-500/40",
                borderClass: "border-l-cyan-500",
                icon: "fa-gamepad",
                glow: "neon-glow-cyan"
            },
            rebellions: {
                label: "Révolution & Underground",
                badgeClass: "bg-red-950/80 text-red-400 border-red-500/40",
                borderClass: "border-l-red-500",
                icon: "fa-fire",
                glow: "neon-glow-red"
            },
            corpo: {
                label: "Corporations & Armement",
                badgeClass: "bg-amber-950/80 text-amber-400 border-amber-500/40",
                borderClass: "border-l-amber-500",
                icon: "fa-building-shield",
                glow: "neon-glow-amber"
            },
            justice: {
                label: "Justice, Procès & Purge",
                badgeClass: "bg-purple-950/80 text-purple-400 border-purple-500/40",
                borderClass: "border-l-purple-500",
                icon: "fa-gavel",
                glow: ""
            },
            spatial: {
                label: "Seldon & Conquête",
                badgeClass: "bg-emerald-950/80 text-emerald-400 border-emerald-500/40",
                borderClass: "border-l-emerald-500",
                icon: "fa-shuttle-space",
                glow: ""
            }
        };

        function renderTimeline() {
            const container = document.getElementById('timeline-container');
            const emptyState = document.getElementById('empty-state');
            container.innerHTML = '';

            const filtered = timelineEvents.filter(evt => {
                if (!showSecrets && evt.isSecret) return false;
                if (currentFilter === 'scenario' && evt.category !== 'scenario') return false;
                if (currentFilter === 'rebellions' && evt.category !== 'rebellions') return false;
                if (currentFilter === 'corpo' && evt.category !== 'corpo') return false;
                if (currentFilter === 'secret' && !evt.isSecret) return false;

                if (searchQuery.trim() !== '') {
                    const q = searchQuery.toLowerCase();
                    const matchTitle = evt.title.toLowerCase().includes(q);
                    const matchDate = evt.date.toLowerCase().includes(q);
                    const matchDesc = evt.desc.toLowerCase().includes(q);
                    const matchSummary = (evt.sessionSummary || '').toLowerCase().includes(q);
                    const matchHighlights = (evt.highlights || []).some(h => h.toLowerCase().includes(q));
                    if (!matchTitle && !matchDate && !matchDesc && !matchSummary && !matchHighlights) return false;
                }
                return true;
            });

            if (filtered.length === 0) {
                emptyState.classList.remove('hidden');
                return;
            } else {
                emptyState.classList.add('hidden');
            }

            filtered.forEach((evt, index) => {
                const style = CATEGORY_STYLES[evt.category] || CATEGORY_STYLES.corpo;
                const isEven = index % 2 === 0;
                const hasDebrief = (evt.sessionSummary && evt.sessionSummary.trim() !== '') || (evt.highlights && evt.highlights.length > 0);

                const cardEl = document.createElement('div');
                cardEl.className = `relative flex flex-col sm:flex-row items-start ${isEven ? 'sm:flex-row-reverse' : ''} gap-4 group`;

                const dateDotHtml = `
                    <div class="hidden sm:flex absolute left-1/2 -translate-x-1/2 w-8 h-8 rounded-full bg-slate-900 border-2 ${evt.isSecret ? 'border-purple-500 text-purple-400' : 'border-cyber-cyan text-cyber-cyan'} items-center justify-center text-xs z-10 shadow-lg cursor-pointer hover:scale-110 transition" onclick="openDebriefModal('${evt.id}')">
                        <i class="fa-solid ${style.icon}"></i>
                    </div>
                `;

                const cardContent = `
                    <div class="w-full sm:w-[calc(50%-2rem)] bg-cyber-card border border-cyber-border/80 hover:border-slate-500 rounded-xl p-4 transition-all duration-200 border-l-4 ${style.borderClass} shadow-lg ${evt.isSecret ? 'bg-gradient-to-br from-cyber-card to-purple-950/20' : ''} cursor-pointer group hover:bg-slate-900/40" onclick="handleCardClick(event, '${evt.id}')">
                        <div class="flex items-center justify-between gap-2 mb-2">
                            <span class="font-mono text-xs px-2 py-0.5 rounded font-bold uppercase tracking-wider ${style.badgeClass}">
                                ${evt.date}
                            </span>
                            <div class="flex items-center gap-1.5" onclick="event.stopPropagation()">
                                ${evt.isSecret ? '<span class="text-[10px] font-mono px-1.5 py-0.5 rounded bg-purple-950 border border-purple-500/50 text-purple-300 font-bold"><i class="fa-solid fa-lock"></i> SECRET MJ</span>' : ''}
                                <button onclick="editEvent('${evt.id}')" class="text-slate-400 hover:text-cyber-cyan p-1 text-xs" title="Modifier">
                                    <i class="fa-solid fa-pen"></i>
                                </button>
                                <button onclick="deleteEvent('${evt.id}')" class="text-slate-400 hover:text-cyber-red p-1 text-xs" title="Supprimer">
                                    <i class="fa-solid fa-trash"></i>
                                </button>
                            </div>
                        </div>

                        <h3 class="font-tech text-base sm:text-lg font-bold text-white tracking-wide mb-2 flex items-center justify-between">
                            <span>${evt.title}</span>
                            <span class="text-xs text-cyber-cyan font-mono opacity-0 group-hover:opacity-100 transition flex items-center gap-1">
                                <i class="fa-solid fa-magnifying-glass-plus"></i> Débrief
                            </span>
                        </h3>

                        <p class="text-xs sm:text-sm text-slate-300 font-sans leading-relaxed">
                            ${evt.desc}
                        </p>

                        <!-- Indicateur de Compte-rendu disponible -->
                        ${hasDebrief ? `
                            <div class="mt-3 pt-2 border-t border-slate-800/80 flex items-center gap-2">
                                <span class="px-2 py-0.5 rounded bg-cyan-950/60 border border-cyan-500/30 text-cyan-300 text-[10px] font-mono flex items-center gap-1">
                                    <i class="fa-solid fa-file-lines"></i> Compte-rendu & Faits marquants (${evt.highlights ? evt.highlights.length : 0})
                                </span>
                            </div>
                        ` : ''}

                        <div class="mt-3 pt-2 border-t border-slate-800/80 flex items-center justify-between text-[11px] font-mono text-slate-400">
                            <span><i class="fa-solid ${style.icon} mr-1"></i> ${style.label}</span>
                            <span class="text-slate-500">ID: #${evt.id}</span>
                        </div>
                    </div>
                `;

                cardEl.innerHTML = dateDotHtml + cardContent;
                container.appendChild(cardEl);
            });
        }

        function handleCardClick(event, id) {
            openDebriefModal(id);
        }

        const debriefModal = document.getElementById('debrief-modal');
        function openDebriefModal(id) {
            const evt = timelineEvents.find(e => e.id === id);
            if (!evt) return;

            activeDebriefEventId = id;
            const style = CATEGORY_STYLES[evt.category] || CATEGORY_STYLES.corpo;

            document.getElementById('debrief-badge').innerText = style.label;
            document.getElementById('debrief-badge').className = `font-mono text-xs px-2.5 py-1 rounded border font-bold uppercase tracking-wider ${style.badgeClass}`;
            document.getElementById('debrief-date').innerText = evt.date;
            document.getElementById('debrief-title').innerText = evt.title;
            document.getElementById('debrief-baseline').innerText = evt.desc;

            const summaryContainer = document.getElementById('debrief-summary');
            if (evt.sessionSummary && evt.sessionSummary.trim() !== '') {
                summaryContainer.innerHTML = evt.sessionSummary;
                summaryContainer.classList.remove('italic', 'text-slate-500');
            } else {
                summaryContainer.innerHTML = "Aucun résumé narratif n'a encore été saisi pour cette séance.";
                summaryContainer.classList.add('italic', 'text-slate-500');
            }

            const highlightsContainer = document.getElementById('debrief-highlights');
            highlightsContainer.innerHTML = '';
            if (evt.highlights && evt.highlights.length > 0) {
                evt.highlights.forEach(h => {
                    const li = document.createElement('li');
                    li.className = 'flex items-start gap-2.5 bg-slate-900/60 border border-slate-800 p-2.5 rounded-lg text-slate-200';
                    li.innerHTML = `
                        <i class="fa-solid fa-caret-right text-amber-400 mt-0.5"></i>
                        <span>${h}</span>
                    `;
                    highlightsContainer.appendChild(li);
                });
            } else {
                highlightsContainer.innerHTML = `<li class="text-slate-500 italic">Aucun fait marquant consigné.</li>`;
            }

            debriefModal.classList.remove('hidden');
        }

        function closeDebriefModal() {
            debriefModal.classList.add('hidden');
            activeDebriefEventId = null;
        }

        document.getElementById('btn-close-debrief').addEventListener('click', closeDebriefModal);
        document.getElementById('btn-debrief-close-bottom').addEventListener('click', closeDebriefModal);
        document.getElementById('btn-debrief-edit').addEventListener('click', () => {
            const idToEdit = activeDebriefEventId;
            closeDebriefModal();
            if (idToEdit) {
                openModal(idToEdit);
            }
        });

        const modal = document.getElementById('event-modal');
        const form = document.getElementById('event-form');

        function openModal(editId = null) {
            form.reset();
            const modalTitle = document.getElementById('modal-title');
            if (editId) {
                const evt = timelineEvents.find(e => e.id === editId);
                if (!evt) return;
                document.getElementById('form-event-id').value = evt.id;
                document.getElementById('form-date').value = evt.date;
                document.getElementById('form-title').value = evt.title;
                document.getElementById('form-category').value = evt.category;
                document.getElementById('form-secret').value = evt.isSecret ? "true" : "false";
                document.getElementById('form-desc').value = evt.desc;
                document.getElementById('form-summary').value = evt.sessionSummary || "";
                document.getElementById('form-highlights').value = (evt.highlights || []).join('\n');
                modalTitle.innerHTML = `<i class="fa-solid fa-pen-to-square"></i> Modifier l'Événement`;
            } else {
                document.getElementById('form-event-id').value = '';
                modalTitle.innerHTML = `<i class="fa-solid fa-clock-rotate-left"></i> Ajouter un Événement`;
            }
            modal.classList.remove('hidden');
        }

        function closeModal() {
            modal.classList.add('hidden');
        }

        window.editEvent = function(id) {
            openModal(id);
        };

        window.deleteEvent = function(id) {
            const index = timelineEvents.findIndex(e => e.id === id);
            if (index !== -1) {
                const removed = timelineEvents.splice(index, 1)[0];
                saveToLocalStorage();
                renderTimeline();
                showToast(`Jalon "${removed.title}" supprimé`, 'danger');
            }
        };

        form.addEventListener('submit', (e) => {
            e.preventDefault();
            const editId = document.getElementById('form-event-id').value;
            const date = document.getElementById('form-date').value.trim();
            const title = document.getElementById('form-title').value.trim();
            const category = document.getElementById('form-category').value;
            const isSecret = document.getElementById('form-secret').value === 'true';
            const desc = document.getElementById('form-desc').value.trim();
            const sessionSummary = document.getElementById('form-summary').value.trim();
            const rawHighlights = document.getElementById('form-highlights').value;
            const highlights = rawHighlights.split('\n').map(h => h.trim()).filter(h => h.length > 0);

            if (editId) {
                const target = timelineEvents.find(e => e.id === editId);
                if (target) {
                    target.date = date;
                    target.title = title;
                    target.category = category;
                    target.isSecret = isSecret;
                    target.desc = desc;
                    target.sessionSummary = sessionSummary;
                    target.highlights = highlights;
                    showToast('Événement mis à jour', 'success');
                }
            } else {
                const newEvt = {
                    id: "evt-" + Date.now().toString().slice(-6),
                    date,
                    title,
                    category,
                    isSecret,
                    desc,
                    sessionSummary,
                    highlights
                };
                timelineEvents.push(newEvt);
                showToast('Nouvel événement ajouté à la timeline', 'success');
            }

            // Tri après l'ajout ou la modification
            sortTimeline();
            saveToLocalStorage();
            renderTimeline();
            closeModal();
        });

        const btnToggleSecret = document.getElementById('btn-toggle-secret');
        const labelSecret = document.getElementById('label-secret');
        btnToggleSecret.addEventListener('click', () => {
            showSecrets = !showSecrets;
            if (showSecrets) {
                labelSecret.innerText = "Mode MJ : Activé";
                btnToggleSecret.className = "px-3 py-1.5 rounded-md border border-amber-500/40 bg-amber-500/10 text-amber-400 text-xs font-mono font-semibold hover:bg-amber-500/20 transition flex items-center gap-1.5";
            } else {
                labelSecret.innerText = "Vue Joueurs (Secrets Masqués)";
                btnToggleSecret.className = "px-3 py-1.5 rounded-md border border-slate-700 bg-slate-900 text-slate-400 text-xs font-mono font-semibold hover:bg-slate-800 transition flex items-center gap-1.5";
            }
            renderTimeline();
        });

        document.getElementById('btn-add-event').addEventListener('click', () => openModal());
        document.getElementById('btn-close-modal').addEventListener('click', closeModal);
        document.getElementById('btn-cancel-modal').addEventListener('click', closeModal);

        document.getElementById('input-search').addEventListener('input', (e) => {
            searchQuery = e.target.value;
            renderTimeline();
        });

        const filterChips = document.querySelectorAll('.filter-chip');
        filterChips.forEach(chip => {
            chip.addEventListener('click', () => {
                filterChips.forEach(c => {
                    c.classList.remove('active', 'bg-slate-800', 'border-slate-500', 'text-white', 'font-semibold');
                    c.classList.add('bg-slate-900/60');
                });
                chip.classList.add('active', 'bg-slate-800', 'border-slate-500', 'text-white', 'font-semibold');
                currentFilter = chip.getAttribute('data-filter');
                renderTimeline();
            });
        });

        const btnDataMenu = document.getElementById('btn-data-menu');
        const dataDropdown = document.getElementById('data-dropdown');
        btnDataMenu.addEventListener('click', (e) => {
            e.stopPropagation();
            dataDropdown.classList.toggle('hidden');
        });

        document.addEventListener('click', () => {
            dataDropdown.classList.add('hidden');
        });

        document.getElementById('btn-export').addEventListener('click', () => {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(timelineEvents, null, 2));
            const dlAnchor = document.createElement('a');
            dlAnchor.setAttribute("href", dataStr);
            dlAnchor.setAttribute("download", "yeast_eaters_timeline.json");
            dlAnchor.click();
            showToast('Fichier JSON exporté avec succès', 'info');
        });

        document.getElementById('input-import').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (event) => {
                try {
                    const imported = JSON.parse(event.target.result);
                    if (Array.isArray(imported)) {
                        timelineEvents = imported;
                        // Tri forcé en cas d'importation d'un fichier brut non ordonné
                        sortTimeline();
                        saveToLocalStorage();
                        renderTimeline();
                        showToast('Chronologie importée et triée avec succès', 'success');
                    } else {
                        showToast('Format JSON invalide', 'danger');
                    }
                } catch(err) {
                    showToast('Erreur de lecture du fichier', 'danger');
                }
            };
            reader.readAsText(file);
        });

        document.getElementById('btn-reset').addEventListener('click', () => {
            localStorage.removeItem('yeast_eaters_timeline_v2');
            timelineEvents = JSON.parse(JSON.stringify(DEFAULT_TIMELINE));
            sortTimeline();
            saveToLocalStorage();
            renderTimeline();
            showToast('Timeline réinitialisée avec les faits réels du Scénario 1', 'info');
        });

        window.onload = function() {
            initData();
        };
    </script>
</body>
</html>
