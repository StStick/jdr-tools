name: Deploy timeline to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - main.html
      - json_save/**
      - scenarios/**
      - personnages/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Build site with latest timeline save
        run: |
          python - <<'PY'
          import json
          import re
          import shutil
          from datetime import datetime
          from pathlib import Path

          saves = list(Path("json_save").glob("version_*.json"))
          if not saves:
              raise SystemExit("Aucun fichier version_*.json trouvé dans json_save/")

          def version_date(path):
              version = path.stem.removeprefix("version_")
              try:
                  return datetime.strptime(version, "%d-%m-%y")
              except ValueError as error:
                  raise SystemExit(
                      f"Nom de sauvegarde invalide : {path.name} "
                      "(format attendu : version_JJ-MM-AA.json)"
                  ) from error

          latest = max(saves, key=version_date)
          with latest.open(encoding="utf-8") as save_file:
              data = json.load(save_file)
          if not isinstance(data, list):
              raise SystemExit(f"La sauvegarde {latest} doit contenir une liste JSON")

          site = Path("_site")
          site.mkdir()
          shutil.copyfile("main.html", site / "index.html")
          shutil.copyfile(latest, site / "latest.json")
          published_scenarios = []
          scenario_files = sorted(Path("scenarios").glob("*.md")) if Path("scenarios").exists() else []
          for scenario_file in scenario_files:
              if scenario_file.name.lower() == "readme.md":
                  continue

              content = scenario_file.read_text(encoding="utf-8")
              front_matter = re.match(r"\A---\r?\n(.*?)\r?\n---(?:\r?\n|\Z)", content, re.DOTALL)
              if not front_matter:
                  raise SystemExit(
                      f"{scenario_file} doit commencer par un en-tête YAML "
                      "(title, date, secret) encadré par ---"
                  )

              metadata = {}
              for line in front_matter.group(1).splitlines():
                  if ":" not in line:
                      continue
                  key, value = line.split(":", 1)
                  value = value.strip()
                  try:
                      metadata[key.strip()] = json.loads(value)
                  except json.JSONDecodeError:
                      metadata[key.strip()] = value.strip("'\"")

              title = metadata.get("title")
              if not isinstance(title, str) or not title.strip():
                  raise SystemExit(f"{scenario_file} doit définir un titre non vide")
              published_scenarios.append({
                  "id": scenario_file.stem,
                  "filename": scenario_file.name,
                  "title": title,
                  "date": metadata.get("date", ""),
                  "isSecret": str(metadata.get("secret", "false")).lower() == "true",
                  "content": content,
              })

          scenario_output = site / "scenarios"
          scenario_output.mkdir()
          for scenario_file in scenario_files:
              if scenario_file.name.lower() != "readme.md":
                  shutil.copyfile(scenario_file, scenario_output / scenario_file.name)
          (scenario_output / "index.json").write_text(
              json.dumps(published_scenarios, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )

          characters = []
          character_files = sorted(Path("personnages").glob("*.md")) if Path("personnages").exists() else []
          for character_file in character_files:
              if character_file.name.lower() == "readme.md":
                  continue

              content = character_file.read_text(encoding="utf-8")
              front_matter = re.match(r"\A---\r?\n(.*?)\r?\n---(?:\r?\n|\Z)", content, re.DOTALL)
              if not front_matter:
                  raise SystemExit(
                      f"{character_file} doit commencer par un en-tête Markdown "
                      "(name, kind et category) encadré par ---"
                  )

              metadata = {}
              for line in front_matter.group(1).splitlines():
                  if ":" not in line:
                      continue
                  key, value = line.split(":", 1)
                  value = value.strip()
                  try:
                      metadata[key.strip()] = json.loads(value)
                  except json.JSONDecodeError:
                      metadata[key.strip()] = value.strip("'\"")

              name = metadata.get("name")
              kind = metadata.get("kind")
              category = metadata.get("category")
              if not isinstance(name, str) or not name.strip():
                  raise SystemExit(f"{character_file} doit définir un nom non vide")
              if kind not in ("PJ", "PNJ"):
                  raise SystemExit(f"{character_file} doit définir kind: PJ ou kind: PNJ")
              if not isinstance(category, str) or not category.strip():
                  raise SystemExit(f"{character_file} doit définir une catégorie non vide")

              body = content[front_matter.end():].strip()
              headings = list(re.finditer(r"^##\s+(.+?)\s*$", body, re.MULTILINE))
              expected_headings = ["Personnalité", "Histoire", "Objectif"]
              actual_headings = [heading.group(1).strip() for heading in headings]
              if actual_headings != expected_headings:
                  raise SystemExit(
                      f"{character_file} doit contenir, dans cet ordre, les rubriques "
                      "'## Personnalité', '## Histoire' et '## Objectif'"
                  )

              fields = []
              for index, heading in enumerate(headings):
                  field_end = headings[index + 1].start() if index + 1 < len(headings) else len(body)
                  field_content = body[heading.end():field_end].strip()
                  if not field_content:
                      raise SystemExit(
                          f"{character_file} doit renseigner la rubrique "
                          f"'{heading.group(1).strip()}'"
                      )
                  fields.append({"label": heading.group(1).strip(), "content": field_content})
              characters.append({
                  "id": character_file.stem,
                  "name": name.strip(),
                  "kind": kind,
                  "category": category.strip(),
                  "fields": fields,
              })

          if not characters:
              raise SystemExit("Aucun fichier personnage .md trouvé dans personnages/")
          characters_output = site / "characters"
          characters_output.mkdir()
          (characters_output / "index.json").write_text(
              json.dumps(characters, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          for character_file in character_files:
              if character_file.name.lower() != "readme.md":
                  shutil.copyfile(character_file, characters_output / character_file.name)
          print(
              f"Publication de {latest} ({len(data)} événements) et "
              f"{len(published_scenarios)} scénario(s) et {len(characters)} personnage(s)"
          )
          PY

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
